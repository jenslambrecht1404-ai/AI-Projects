{% extends "base.html" %}
{% block title %}Neue Interview-Session{% endblock %}

{% block content %}
<h1>Neue Interview-Vorbereitung</h1>
<p class="subtitle">Geben Sie die Details ein und die KI generiert relevante Fragen mit Antwortvorschlägen.</p>

<div class="card" style="max-width:600px">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="company_name">Unternehmen *</label>
            <input type="text" id="company_name" name="company_name" required placeholder="z.B. Airbus Defence and Space">
        </div>
        <div class="form-group">
            <label for="position">Position *</label>
            <input type="text" id="position" name="position" required placeholder="z.B. Senior Manager Digital Transformation">
        </div>
        <div class="form-group">
            <label for="job_description">Stellenbeschreibung (optional)</label>
            <textarea id="job_description" name="job_description" rows="6" placeholder="Für bessere Ergebnisse die Stellenbeschreibung einfügen ..."></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Session generieren</button>
            <a href="{{ url_for('interview_list') }}" class="btn btn-secondary">Abbrechen</a>
        </div>
    </form>
</div>
{% endblock %}
